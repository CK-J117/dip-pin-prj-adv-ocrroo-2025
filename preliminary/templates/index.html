<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Reading OCR</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="{{ theme }}">

  <nav class="theme-controls" aria-label="Display Options">
    <span class="theme-label">Display:</span>
    <a href="/?theme=" class="theme-btn {% if theme == '' %}active{% endif %}">Default</a>
    <a href="/?theme=theme-high-contrast" class="theme-btn {% if theme == 'theme-high-contrast' %}active{% endif %}">High Contrast</a>
    <a href="/?theme=theme-yellow-black" class="theme-btn {% if theme == 'theme-yellow-black' %}active{% endif %}">Yellow/Black</a>
    <a href="/?theme=theme-blue-white" class="theme-btn {% if theme == 'theme-blue-white' %}active{% endif %}">Blue/White</a>
    <a href="/?theme=theme-cream" class="theme-btn {% if theme == 'theme-cream' %}active{% endif %}">Cream</a>
    <a href="/?theme=theme-dyslexia" class="theme-btn {% if theme == 'theme-dyslexia' %}active{% endif %}">Dyslexia</a>
    <a href="/?theme=theme-irlen" class="theme-btn {% if theme == 'theme-irlen' %}active{% endif %}">Irlen</a>
    <a href="/?theme=theme-photophobia" class="theme-btn {% if theme == 'theme-photophobia' %}active{% endif %}">Light Sensitive</a>
  </nav>


    <div class="panel-container">
        <div class="text-panel">
            <h2>Text from Frame:</h2>
            <p>Your descriptive text goes here.</p>
        </div>
        <div class="video-panel">
          <form method="get" action="/">
            <select name="video_id">
             {% for video_id, path in videos.items() %}
                <option value="{{ video_id }}">{{ path.stem }}</option>
             {% endfor %}
            </select>
            <button type="submit">Play</button>
          </form>
          {% if video_id %}
            <video controls width="640" src="/video/{{ video_id }}/stream"></video>
          {% endif %}
        </div>
    </div>
</body>
</html>
