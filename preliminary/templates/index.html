<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form method="get" action="/">
        <select name="video_id">
             {% for video_id, path in videos.items() %}
                <option value="{{ video_id }}">{{ path.stem }}</option>
            {% endfor %}
        </select>
        <button type="submit">Play</button>
    </form>
    {% if video_id %}
    <video controls width="640" src="/video/{{ video_id }}/stream"></video>
    {% endif %}
</body>
</html>
